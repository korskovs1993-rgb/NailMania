<section class="card calendar public-calendar" aria-label="Календарь записи"><div class="calendar-toolbar"><div><span class="eyebrow">ВЫБЕРИ СВОЙ ДЕНЬ</span><h2>{{ selected|date:'F Y' }}</h2></div><div class="calendar-arrows"><a href="?date={{ previous|date:'Y-m-d' }}" aria-label="Предыдущий месяц">‹</a><a href="?date={{ next_month|date:'Y-m-d' }}" aria-label="Следующий месяц">›</a></div></div><p>Цветом отмечены дни со свободным временем. Выбери услуги ниже — покажем подходящие часы.</p><div class="calendar-weekdays"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div class="calendar-dates">{% for day in public_days %}<a class="calendar-date {% if day.available %}has-visits{% endif %} {% if day.outside %}other-month{% endif %} {% if day.date == selected %}is-selected{% endif %}" href="?date={{ day.date|date:'Y-m-d' }}#booking-form" data-public-day="{{ day.date|date:'Y-m-d' }}" aria-label="{{ day.date|date:'j E' }}: {% if day.available %}есть свободное время{% else %}запись недоступна{% endif %}"><span class="date-number">{{ day.date|date:'j' }}</span></a>{% endfor %}</div></section>
